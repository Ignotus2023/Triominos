name: Deploy web (GitHub Pages)

# Uruchamiane RĘCZNIE. Zanim zadziała, właściciel repo musi w
# Settings → Pages ustawić źródło na "GitHub Actions" (zamiast
# "Deploy from a branch /docs"). Po pierwszym udanym deployu katalog
# `docs/` można usunąć z repozytorium (audyt M-9) — strona będzie
# budowana i publikowana z CI zamiast commitowanego artefaktu.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /Triominos/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
